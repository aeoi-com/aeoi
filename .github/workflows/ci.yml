name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests tools
      - run: python -m ruff format --check src/aeoi/estv src/aeoi/crs src/aeoi/cli.py src/aeoi/registry.py tests tools
      - run: python -m pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: install the wheel in a clean environment and run the CLI
        run: |
          python -m venv /tmp/clean && /tmp/clean/bin/python -m pip install dist/*.whl
          /tmp/clean/bin/aeoi --version
          /tmp/clean/bin/aeoi crs template --out /tmp/example.xlsx --example
          /tmp/clean/bin/aeoi crs build --input /tmp/example.xlsx --version 3.0 --out /tmp/Test-report.xml --test
          /tmp/clean/bin/aeoi crs validate /tmp/Test-report.xml
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  web:
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: mkdir -p .local/pyodide-test && cd .local/pyodide-test && npm install --silent pyodide@0.27.7
      - run: node tools/web_smoke.mjs
      - run: python tools/build_web.py
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: web/

  dco:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: every commit of the pull request carries a Signed-off-by line
        run: |
          missing=$(git log --format='%H %s%n%b' ${{ github.event.pull_request.base.sha }}..${{ github.sha }} \
            | awk '/^[0-9a-f]{40} /{if (h && !s) print h; h=$1; s=0} /^Signed-off-by:/{s=1} END{if (h && !s) print h}')
          if [ -n "$missing" ]; then echo "commits without DCO sign-off: $missing"; exit 1; fi
