name: Publish the browser validator

# Publishes web/ (a static page, no server side) to GitHub Pages on every push to main.
# Enable Pages with "GitHub Actions" as the source once; nothing else to configure.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build && python -m pip install dist/*.whl && python tools/build_web.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
